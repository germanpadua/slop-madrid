<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>block-game</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/gh/mrdoob/three.js@dev/build/three.webgpu.js",
  "three/webgpu": "https://cdn.jsdelivr.net/gh/mrdoob/three.js@dev/build/three.webgpu.js",
  "three/tsl": "https://cdn.jsdelivr.net/gh/mrdoob/three.js@dev/build/three.tsl.js",
  "three/addons/": "https://cdn.jsdelivr.net/gh/mrdoob/three.js@dev/examples/jsm/"
} }
</script></head>
<body style="margin:0">
<script type="module">
import * as THREE from 'three/webgpu';
import { createPreWarBuildingMaterial, createFacadeBoxes } from './js/tsl-materials.js';
import { partyWallHeights } from './js/madrid-adjacency.js';
window.onerror = (m) => { fetch('/__shot?name=err', { method: 'POST', body: String(m) }).catch(() => {}); };
window.addEventListener('unhandledrejection', (e) => { fetch('/__shot?name=err', { method: 'POST', body: 'rej:' + String(e.reason && e.reason.message || e.reason) }).catch(() => {}); });
const canvas = document.createElement('canvas');
canvas.width = 1280; canvas.height = 720;
const ctx = canvas.getContext('webgl2', { antialias: true, alpha: true, depth: true, stencil: false, preserveDrawingBuffer: true });
const renderer = new THREE.WebGPURenderer({ canvas, context: ctx, antialias: true, forceWebGL: true });
renderer.setSize(1280, 720);
await renderer.init();
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9db8d6);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7f6a, 1.25));
const sun = new THREE.DirectionalLight(0xfff2dd, 1.8);
sun.position.set(-60, 90, -40);
scene.add(sun);

const data = await (await fetch('./block.json')).json();
// Game-exact facade options (js/madrid-tiles.js MADRID_FACADE_OPTS, verbatim)
const OPTS = [
  { stoneColor: 0xe7ddc6, trimColor: 0xcfc2a6, windowGlassColor: 0x202e3a, windowWidth: 1.5, floorHeight: 3.4, litProbability: 0.5, warmth: 0.85, seed: 21.7 },
  { stoneColor: 0xa45538, trimColor: 0xd8c39a, windowGlassColor: 0x1c2833, windowWidth: 1.5, floorHeight: 3.3, litProbability: 0.48, warmth: 0.9, seed: 33.2 },
  { stoneColor: 0xe3d7bd, trimColor: 0xb09877, windowGlassColor: 0x243441, windowWidth: 1.4, floorHeight: 3.1, litProbability: 0.45, warmth: 0.9, seed: 47.9 }
];
// Game-exact helpers (js/madrid-tile-world.js)
const hash = (x, z, salt = 0) => { const v = Math.sin(x * 12.9898 + z * 78.233 + salt * 37.719) * 43758.5453; return v - Math.floor(v); };
const CX = data.parcels.reduce((a, p) => a + p.ring[0], 0) / data.parcels.length;
const CZ = data.parcels.reduce((a, p) => a + p.ring[1], 0) / data.parcels.length;

// Parcel AABBs (game-exact)
const pabs = [];
data.parcels.forEach((p, index) => {
  if (!p || !p.ring || !(p.h > 0) || p.ring.length < 6) return;
  let x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9;
  for (let i = 0; i + 1 < p.ring.length; i += 2) {
    x0 = Math.min(x0, p.ring[i]); x1 = Math.max(x1, p.ring[i]);
    z0 = Math.min(z0, p.ring[i + 1]); z1 = Math.max(z1, p.ring[i + 1]);
  }
  const w = x1 - x0, d = z1 - z0;
  if (w < 2 || d < 2) return;
  pabs.push({ x0, x1, z0, z1, w, d, h: p.h, index, ring: p.ring });
});
function buildItems(medianera) {
  const items = OPTS.map(() => []);
  const NHH = medianera ? partyWallHeights(pabs) : null;
  for (const P of pabs) {
    const cx = (P.x0 + P.x1) / 2 - CX, cz = (P.z0 + P.z1) / 2 - CZ;
    const tier = Math.floor(hash(cx, cz, P.index) * OPTS.length) % OPTS.length;
    const tone = hash(cz, cx, 3);
    if (!medianera) { items[tier].push({ x: cx, y: P.h / 2, z: cz, w: P.w, h: P.h, d: P.d, tone, faces: [0, 0, 0, 0] }); continue; }
    const nH = NHH[pabs.indexOf(P)];
    const exposed = nH.map((n) => n >= 1 && P.h - n >= 2.5 && P.h - n <= P.h * 0.5);
    if (!exposed.some(Boolean)) { items[tier].push({ x: cx, y: P.h / 2, z: cz, w: P.w, h: P.h, d: P.d, tone, faces: [0, 0, 0, 0] }); continue; }
    const nMin = Math.min(...nH.filter((n, i) => exposed[i]));
    items[tier].push({ x: cx, y: nMin / 2, z: cz, w: P.w, h: nMin, d: P.d, tone, faces: [0, 0, 0, 0] });
    const upFaces = nH.map((n, i) => (exposed[i] && n <= nMin + 0.5 ? 3 : 0)); // lotLine above the lower neighbor
    items[tier].push({ x: cx, y: nMin + (P.h - nMin) / 2, z: cz, w: P.w, h: P.h - nMin, d: P.d, tone, faces: upFaces });
  }
  return items;
}
function build(items) {
  const g = new THREE.Group();
  items.forEach((list, i) => {
    if (!list.length) return;
    const mat = createPreWarBuildingMaterial({ ...OPTS[i], boxLocal: true, madrid: true });
    g.add(createFacadeBoxes(mat, list));
  });
  return g;
}
const before = build(buildItems(false)), after = build(buildItems(true));
scene.add(before); scene.add(after);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 300).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0xb7ad99 }));
ground.position.y = -0.05; scene.add(ground);

const cam = new THREE.PerspectiveCamera(45, 1280 / 720, 0.5, 3000);
async function postShot(name) {
  const blob = await new Promise((res) => canvas.toBlob(res, 'image/jpeg', 0.85));
  await fetch('/__shot?name=' + name, { method: 'POST', body: blob });
}
before.visible = true; after.visible = false;
cam.position.set(-38, 1.7, 55); cam.lookAt(5, 9, -10);
renderer.render(scene, cam); await postShot('med-street-before');
before.visible = false; after.visible = true;
renderer.render(scene, cam); await postShot('med-street-after');
cam.position.set(-52, 26, 62); cam.lookAt(0, 8, 0);
renderer.render(scene, cam); await postShot('med-elev-after');
before.visible = true; after.visible = false;
renderer.render(scene, cam); await postShot('med-elev-before');
cam.position.set(-2, 2.2, 34); cam.lookAt(2, 5.5, 15);
renderer.render(scene, cam); await postShot('med-close-before');
before.visible = false; after.visible = true;
renderer.render(scene, cam); await postShot('med-close-after');
// Cache isolation: variants must not share materials; identical opts must hit the cache
const mB = before.children.map((m) => m.material), mA = after.children.map((m) => m.material);
if (mB.length !== mA.length || mB.some((m, i) => m === mA[i])) await fetch('/__shot?name=err', { method: 'POST', body: 'cache-collision' });
if (createPreWarBuildingMaterial({ ...OPTS[0], boxLocal: true }) !== mB[0]) await fetch('/__shot?name=err', { method: 'POST', body: 'cache-miss-identical-opts' });
// Measured cost: median of 15 renders per variant, same camera/scene
async function timeVariant(g) {
  before.visible = false; after.visible = false; g.visible = true;
  cam.position.set(-38, 1.7, 55); cam.lookAt(5, 9, -10);
  for (let i = 0; i < 3; i++) renderer.render(scene, cam);
  const ts = [];
  for (let i = 0; i < 15; i++) { const t0 = performance.now(); renderer.render(scene, cam); ts.push(performance.now() - t0); }
  ts.sort((a, b) => a - b);
  return ts[7];
}
const tB = await timeVariant(before), tA = await timeVariant(after);
await fetch('/__shot?name=perf', { method: 'POST', body: `median render ms (SwiftShader, CPU, 1280x720): before=${tB.toFixed(2)} after=${tA.toFixed(2)} delta=${(tA - tB).toFixed(2)}` });
window.__done = true;
</script></body></html>
